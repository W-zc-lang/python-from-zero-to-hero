<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="480" fill="#f8fafc"/>
  <text x="40" y="50" font-size="26" font-weight="800" fill="#1d3b5a">第 3 章 · 基础语法三要素</text>

  <!-- 缩进 -->
  <g transform="translate(40,90)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#3776ab">① 缩进即结构（没有大括号！）</text>
    <rect x="0" y="16" width="360" height="150" rx="10" fill="#1e1e1e"/>
    <text x="16" y="44" font-family="Consolas,monospace" font-size="13" fill="#9cdcfe">if score &gt;= 60:</text>
    <text x="40" y="66" font-family="Consolas,monospace" font-size="13" fill="#ce9178">    print("及格")</text>
    <text x="16" y="92" font-family="Consolas,monospace" font-size="13" fill="#9cdcfe">else:</text>
    <text x="40" y="114" font-family="Consolas,monospace" font-size="13" fill="#ce9178">    print("不及格")</text>
    <text x="16" y="146" font-size="12" fill="#6a9955"># 同一缩进层级 = 同一个代码块</text>
    <line x1="32" y1="50" x2="32" y2="120" stroke="#ffd43b" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- 注释 -->
  <g transform="translate(420,90)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#3776ab">② 注释：给人看的说明</text>
    <rect x="0" y="16" width="360" height="150" rx="10" fill="#1e1e1e"/>
    <text x="16" y="44" font-family="Consolas,monospace" font-size="13" fill="#6a9955"># 这是单行注释</text>
    <text x="16" y="70" font-family="Consolas,monospace" font-size="13" fill="#6a9955">"""</text>
    <text x="16" y="90" font-family="Consolas,monospace" font-size="13" fill="#6a9955">这是多行注释</text>
    <text x="16" y="110" font-family="Consolas,monospace" font-size="13" fill="#6a9955">用三个引号包裹</text>
    <text x="16" y="130" font-family="Consolas,monospace" font-size="13" fill="#6a9955">"""</text>
    <text x="16" y="154" font-size="12" fill="#9cdcfe">注释不会被执行，仅作说明</text>
  </g>

  <!-- 变量 / 输出 -->
  <g transform="translate(40,270)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#3776ab">③ 变量与输入/输出</text>
    <rect x="0" y="16" width="360" height="170" rx="10" fill="#1e1e1e"/>
    <text x="16" y="44" font-family="Consolas,monospace" font-size="13" fill="#9cdcfe">name = "小明"</text>
    <text x="16" y="68" font-family="Consolas,monospace" font-size="13" fill="#9cdcfe">age = 18</text>
    <text x="16" y="92" font-family="Consolas,monospace" font-size="13" fill="#ce9178">print("你好", name)   # 输出</text>
    <text x="16" y="116" font-family="Consolas,monospace" font-size="13" fill="#ce9178">x = input("输入:")    # 输入</text>
    <text x="16" y="140" font-size="12" fill="#6a9955"># = 是赋值，把右边的值装进左边的"盒子"</text>
    <text x="16" y="162" font-size="12" fill="#6a9955"># 变量无需声明类型，赋值即创建</text>
  </g>

  <!-- 命名规则 -->
  <g transform="translate(420,270)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#3776ab">变量命名规则</text>
    <rect x="0" y="16" width="360" height="170" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <g font-size="13" fill="#495057">
      <text x="16" y="44">✅ 字母、数字、下划线，如 user_name</text>
      <text x="16" y="72">✅ 区分大小写：Age ≠ age</text>
      <text x="16" y="100">❌ 不能以数字开头：2name</text>
      <text x="16" y="128">❌ 不能用关键字：if / for / class</text>
      <text x="16" y="156">💡 推荐 小蛇式：student_count</text>
    </g>
  </g>

  <text x="40" y="468" font-size="13" fill="#868e96">记住：Python 用缩进表达"谁属于谁"，这是它最与众不同也最干净的地方。</text>
</svg>
