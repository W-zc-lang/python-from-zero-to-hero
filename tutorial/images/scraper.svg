<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="500" fill="#f8fafc"/>
  <text x="40" y="50" font-size="26" font-weight="800" fill="#1d3b5a">第 13 章 · 网络爬虫：让程序替你"上网收集信息"</text>
  <text x="40" y="80" font-size="14" fill="#555">爬虫的本质 = 用代码模拟浏览器访问网页，再把想要的字段"摘"出来。</text>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#adb5bd"/>
    </marker>
  </defs>

  <!-- 流程四步 -->
  <g transform="translate(40,110)">
    <!-- 1 -->
    <rect x="0" y="20" width="160" height="78" rx="12" fill="#e7f5ff" stroke="#a5d8ff"/>
    <text x="16" y="50" font-size="15" font-weight="800" fill="#1c7ed6">① 发送请求</text>
    <text x="16" y="74" font-size="13" fill="#495057">requests.get(url)</text>
    <text x="16" y="92" font-size="12" fill="#495057">告诉服务器"我要看这页"</text>
    <path d="M162,58 l28,0" stroke="#adb5bd" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 2 -->
    <rect x="195" y="20" width="160" height="78" rx="12" fill="#ebfbee" stroke="#b2f2bb"/>
    <text x="211" y="50" font-size="15" font-weight="800" fill="#2f9e44">② 获取响应</text>
    <text x="211" y="74" font-size="13" fill="#495057">response.text</text>
    <text x="211" y="92" font-size="12" fill="#495057">服务器返回 HTML 文本</text>
    <path d="M357,58 l28,0" stroke="#adb5bd" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 3 -->
    <rect x="390" y="20" width="160" height="78" rx="12" fill="#f3f0ff" stroke="#d0bfff"/>
    <text x="406" y="50" font-size="15" font-weight="800" fill="#6741d9">③ 解析提取</text>
    <text x="406" y="74" font-size="13" fill="#495057">BeautifulSoup</text>
    <text x="406" y="92" font-size="12" fill="#495057">从 HTML 中摘取字段</text>
    <path d="M552,58 l28,0" stroke="#adb5bd" stroke-width="2" marker-end="url(#ar)"/>

    <!-- 4 -->
    <rect x="585" y="20" width="160" height="78" rx="12" fill="#fff4e6" stroke="#ffd8a8"/>
    <text x="601" y="50" font-size="15" font-weight="800" fill="#e8590c">④ 保存数据</text>
    <text x="601" y="74" font-size="13" fill="#495057">csv / json / 库</text>
    <text x="601" y="92" font-size="12" fill="#495057">落盘或入库供分析</text>
  </g>

  <!-- 数据流示意 -->
  <g transform="translate(40,225)">
    <rect x="0" y="0" width="740" height="92" rx="12" fill="#ffffff" stroke="#dee2e6"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#1d3b5a">数据流一眼看懂</text>
    <text x="16" y="52" font-family="Consolas,monospace" font-size="13" fill="#495057">你的代码  ──HTTP 请求──▶  网站服务器</text>
    <text x="16" y="76" font-family="Consolas,monospace" font-size="13" fill="#495057">你的代码  ◀──HTML 文本──  网站服务器  ──▶  BeautifulSoup 提取字段</text>
  </g>

  <!-- 礼仪与法律 -->
  <g transform="translate(40,335)">
    <rect x="0" y="0" width="740" height="130" rx="12" fill="#fff5f5" stroke="#ffc9c9"/>
    <text x="16" y="28" font-size="15" font-weight="800" fill="#c92a2a">⚠️ 爬虫的礼仪与法律红线（务必遵守）</text>
    <text x="16" y="54" font-size="13" fill="#495057">1. 先看 robots.txt（如 example.com/robots.txt），尊重网站"禁止抓取"的声明。</text>
    <text x="16" y="78" font-size="13" fill="#495057">2. 控制频率：两次请求间加间隔（time.sleep），别把人家服务器压垮。</text>
    <text x="16" y="102" font-size="13" fill="#495057">3. 不爬个人信息、不爬付费/授权内容、不用于商业倒卖——守法是底线。</text>
    <text x="16" y="124" font-size="13" fill="#495057">4. 优先用官方 API；很多网站（如天气、新闻）提供合法数据接口。</text>
  </g>
</svg>
