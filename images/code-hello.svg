<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Consolas, 'Courier New', monospace">
  <rect width="820" height="360" rx="12" fill="#1e1e1e"/>
  <!-- title bar -->
  <rect x="0" y="0" width="820" height="44" rx="12" fill="#323233"/>
  <rect x="0" y="32" width="820" height="12" fill="#323233"/>
  <circle cx="26" cy="22" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="22" r="7" fill="#27c93f"/>
  <text x="120" y="27" font-size="14" fill="#9da5b4">hello.py — 你的第一个 Python 程序</text>

  <!-- code -->
  <g font-size="16">
    <text x="40" y="92" fill="#6a9955"># 这是一行注释，程序不会执行它</text>
    <text x="40" y="128" fill="#9cdcfe">print</text>
    <text x="96" y="128" fill="#d4d4d4">(</text>
    <text x="112" y="128" fill="#ce9178">"Hello, Python!"</text>
    <text x="288" y="128" fill="#d4d4d4">)</text>

    <text x="40" y="172" fill="#9cdcfe">name</text>
    <text x="104" y="172" fill="#d4d4d4"> = </text>
    <text x="136" y="172" fill="#ce9178">"小明"</text>

    <text x="40" y="208" fill="#9cdcfe">print</text>
    <text x="96" y="208" fill="#d4d4d4">(</text>
    <text x="112" y="208" fill="#ce9178">"你好，"</text>
    <text x="200" y="208" fill="#d4d4d4">, </text>
    <text x="216" y="208" fill="#9cdcfe">name</text>
    <text x="256" y="208" fill="#d4d4d4">)</text>

    <text x="40" y="252" fill="#6a9955"># 用 input 接收用户输入</text>
    <text x="40" y="288" fill="#9cdcfe">age</text>
    <text x="88" y="288" fill="#d4d4d4"> = </text>
    <text x="120" y="288" fill="#9cdcfe">input</text>
    <text x="184" y="288" fill="#d4d4d4">(</text>
    <text x="200" y="288" fill="#ce9178">"请输入年龄: "</text>
    <text x="360" y="288" fill="#d4d4d4">)</text>
  </g>

  <!-- run hint -->
  <g transform="translate(40,326)">
    <text x="0" y="0" font-size="14" fill="#858585" font-family="Segoe UI, sans-serif">▶ 终端运行：</text>
    <text x="120" y="0" font-size="14" fill="#4ec9b0" font-family="Consolas, monospace">python hello.py</text>
  </g>
</svg>
