<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="520" fill="#f8fafc"/>
  <text x="40" y="56" font-size="28" font-weight="800" fill="#1d3b5a">为什么学 Python？它适合做什么？</text>
  <text x="40" y="86" font-size="15" fill="#555">Python 以「可读性」和「简洁」著称，被称为"最接近伪代码"的编程语言。</text>

  <!-- 特点 -->
  <g transform="translate(40,120)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#3776ab">六大核心特点</text>
    <g font-size="14">
      <rect x="0" y="20" width="350" height="64" rx="10" fill="#ffffff" stroke="#dee2e6"/>
      <text x="16" y="46" font-weight="700" fill="#1d3b5a">① 语法简洁</text>
      <text x="16" y="70" fill="#555">用更少代码完成同样功能，易读易写。</text>

      <rect x="0" y="96" width="350" height="64" rx="10" fill="#ffffff" stroke="#dee2e6"/>
      <text x="16" y="122" font-weight="700" fill="#1d3b5a">② 跨平台</text>
      <text x="16" y="146" fill="#555">Windows / macOS / Linux 一份代码处处运行。</text>

      <rect x="0" y="172" width="350" height="64" rx="10" fill="#ffffff" stroke="#dee2e6"/>
      <text x="16" y="198" font-weight="700" fill="#1d3b5a">③ 生态丰富</text>
      <text x="16" y="222" fill="#555">数十万个第三方库，开箱即用。</text>

      <rect x="0" y="248" width="350" height="64" rx="10" fill="#ffffff" stroke="#dee2e6"/>
      <text x="16" y="274" font-weight="700" fill="#1d3b5a">④ 解释执行</text>
      <text x="16" y="298" fill="#555">无需编译，写完即可运行，调试友好。</text>

      <rect x="0" y="324" width="350" height="64" rx="10" fill="#ffffff" stroke="#dee2e6"/>
      <text x="16" y="350" font-weight="700" fill="#1d3b5a">⑤ 面向对象</text>
      <text x="16" y="374" fill="#555">既支持过程式，也支持面向上对象编程。</text>

      <rect x="0" y="400" width="350" height="64" rx="10" fill="#ffffff" stroke="#dee2e6"/>
      <text x="16" y="426" font-weight="700" fill="#1d3b5a">⑥ 社区活跃</text>
      <text x="16" y="450" fill="#555">教程、问答、文档随处可见，答疑容易。</text>
    </g>
  </g>

  <!-- 应用领域 -->
  <g transform="translate(430,120)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#3776ab">常见应用领域</text>
    <g font-size="13">
      <rect x="0" y="20" width="160" height="50" rx="10" fill="#e7f5ff" stroke="#a5d8ff"/>
      <text x="14" y="42" font-weight="700" fill="#1c7ed6">Web 开发</text>
      <text x="14" y="60" fill="#555">Django / Flask</text>
      <rect x="180" y="20" width="160" height="50" rx="10" fill="#fff4e6" stroke="#ffd8a8"/>
      <text x="194" y="42" font-weight="700" fill="#e8590c">数据分析</text>
      <text x="194" y="60" fill="#555">Pandas / NumPy</text>

      <rect x="0" y="88" width="160" height="50" rx="10" fill="#ebfbee" stroke="#b2f2bb"/>
      <text x="14" y="110" font-weight="700" fill="#2f9e44">人工智能</text>
      <text x="14" y="128" fill="#555">PyTorch / TF</text>
      <rect x="180" y="88" width="160" height="50" rx="10" fill="#f3f0ff" stroke="#d0bfff"/>
      <text x="194" y="110" font-weight="700" fill="#6741d9">自动化脚本</text>
      <text x="194" y="128" fill="#555">批量处理文件</text>

      <rect x="0" y="156" width="160" height="50" rx="10" fill="#fff0f6" stroke="#fcc2d7"/>
      <text x="14" y="178" font-weight="700" fill="#c2255c">爬虫采集</text>
      <text x="14" y="196" fill="#555">requests / scrapy</text>
      <rect x="180" y="156" width="160" height="50" rx="10" fill="#e6fcf5" stroke="#96f2d7"/>
      <text x="194" y="178" font-weight="700" fill="#0c8599">测试运维</text>
      <text x="194" y="196" fill="#555">pytest / 部署</text>

      <rect x="0" y="224" width="340" height="50" rx="10" fill="#f8f9fa" stroke="#ced4da"/>
      <text x="14" y="246" font-weight="700" fill="#495057">游戏 / 桌面软件</text>
      <text x="14" y="264" fill="#555">Pygame / Tkinter / PyQt</text>

      <rect x="0" y="292" width="340" height="50" rx="10" fill="#f8f9fa" stroke="#ced4da"/>
      <text x="14" y="314" font-weight="700" fill="#495057">科学计算 / 教学</text>
      <text x="14" y="332" fill="#555">SymPy / Matplotlib / 入门首选</text>
    </g>
  </g>
</svg>
