<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="820" height="520" fill="#f8fafc"/>
  <text x="40" y="50" font-size="26" font-weight="800" fill="#1d3b5a">第 11 章 · 异常处理：让程序"跌倒了也能爬起来"</text>

  <!-- try 结构图 -->
  <g transform="translate(40,90)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#3776ab">① try / except / else / finally</text>
    <rect x="0" y="20" width="370" height="60" rx="8" fill="#e7f5ff" stroke="#1c7ed6"/>
    <text x="14" y="44" font-weight="700" fill="#1c7ed6">try</text>
    <text x="60" y="44" fill="#495057">放"可能出错"的代码</text>
    <text x="14" y="72" fill="#495057">程序先尝试执行这里</text>
    <rect x="0" y="92" width="370" height="60" rx="8" fill="#ffe3e3" stroke="#ff6b6b"/>
    <text x="14" y="116" font-weight="700" fill="#c92a2a">except</text>
    <text x="84" y="116" fill="#495057">出错时执行"补救"代码</text>
    <text x="14" y="144" fill="#495057">可捕获指定类型：except ValueError:</text>
    <rect x="0" y="164" width="370" height="48" rx="8" fill="#ebfbee" stroke="#51cf66"/>
    <text x="14" y="188" font-weight="700" fill="#2f9e44">else</text>
    <text x="64" y="188" fill="#495057">没出错才执行（可选）</text>
    <rect x="0" y="224" width="370" height="48" rx="8" fill="#fff4e6" stroke="#ffa94d"/>
    <text x="14" y="248" font-weight="700" fill="#e8590c">finally</text>
    <text x="84" y="248" fill="#495057">无论对错都执行（可选）</text>
  </g>

  <!-- 代码示例 -->
  <g transform="translate(430,90)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#3776ab">② 代码示例</text>
    <rect x="0" y="16" width="350" height="220" rx="10" fill="#1e1e1e"/>
    <text x="14" y="42" font-family="Consolas,monospace" font-size="12.5" fill="#c586c0">try:</text>
    <text x="34" y="62" font-family="Consolas,monospace" font-size="12.5" fill="#9cdcfe">n = int(input("数字:"))</text>
    <text x="34" y="82" font-family="Consolas,monospace" font-size="12.5" fill="#ce9178">print(10 / n)</text>
    <text x="14" y="106" font-family="Consolas,monospace" font-size="12.5" fill="#c586c0">except</text>
    <text x="96" y="106" font-family="Consolas,monospace" font-size="12.5" fill="#4ec9b0">ValueError:</text>
    <text x="34" y="126" font-family="Consolas,monospace" font-size="12.5" fill="#ce9178">print("请输入数字")</text>
    <text x="14" y="150" font-family="Consolas,monospace" font-size="12.5" fill="#c586c0">except</text>
    <text x="96" y="150" font-family="Consolas,monospace" font-size="12.5" fill="#4ec9b0">ZeroDivisionError:</text>
    <text x="34" y="170" font-family="Consolas,monospace" font-size="12.5" fill="#ce9178">print("不能除以0")</text>
    <text x="14" y="194" font-family="Consolas,monospace" font-size="12.5" fill="#c586c0">else:</text>
    <text x="34" y="214" font-family="Consolas,monospace" font-size="12.5" fill="#ce9178">print("成功")</text>
  </g>

  <!-- 常见异常 -->
  <g transform="translate(40,310)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#3776ab">③ 常见内置异常</text>
    <g font-size="13" fill="#495057">
      <rect x="0" y="16" width="175" height="42" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="14" y="42" font-weight="700" fill="#c92a2a">ValueError</text>
      <rect x="185" y="16" width="175" height="42" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="199" y="42" font-weight="700" fill="#c92a2a">TypeError</text>
      <rect x="370" y="16" width="175" height="42" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="384" y="42" font-weight="700" fill="#c92a2a">FileNotFoundError</text>
      <rect x="0" y="66" width="175" height="42" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="14" y="92" font-weight="700" fill="#c92a2a">IndexError</text>
      <rect x="185" y="66" width="175" height="42" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="199" y="92" font-weight="700" fill="#c92a2a">KeyError</text>
      <rect x="370" y="66" width="175" height="42" rx="8" fill="#ffffff" stroke="#dee2e6"/>
      <text x="384" y="92" font-weight="700" fill="#c92a2a">ZeroDivisionError</text>
    </g>
  </g>

  <!-- 自定义异常 -->
  <g transform="translate(40,440)">
    <rect x="0" y="0" width="740" height="60" rx="10" fill="#fff9db" stroke="#ffe066"/>
    <text x="16" y="26" font-size="14" font-weight="700" fill="#e67700">💡 自定义异常</text>
    <text x="16" y="50" font-size="13" fill="#664d03">class MyError(Exception): pass —— 继承 Exception 即可定义自己的错误类型，让报错更语义化。</text>
  </g>
</svg>
